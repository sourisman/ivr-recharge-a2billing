[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]

[sub-deduct-credit]
exten => s,1,NoOp(=== Debit Credit ===)
 same => n,Return()

[internal]
exten => _*889#,1,NoOp(=== Check Balance ===)
 same => n,Answer()
 same => n,AGI(check_user.php,${CALLERID(num)})
 same => n,Playback(vm-youhave)
 same => n,SayNumber(${SOLDE})
 same => n,Hangup()

exten => _*123.,1,NoOp(=== Recharge Menu ===)
 same => n,Answer()
 same => n,AGI(check_user.php,${CALLERID(num)})
 same => n,Playback(pls-enter-your)
 same => n,Read(CODE,,20)
 same => n,AGI(apply_recharge.php,${CALLERID(num)},${CODE})
 same => n,GotoIf($["${RECHARGE_OK}" = "1"]?ok)
 same => n,Playback(auth-incorrect)
 same => n,Hangup()
 same => n(ok),Playback(auth-thankyou)
 same => n,Playback(vm-youhave)
 same => n,SayNumber(${NOUVEAU_SOLDE})
 same => n,Hangup()

exten => _1XX,1,NoOp(=== Call ${EXTEN} ===)
 same => n,AGI(check_user.php,${CALLERID(num)})
 same => n,GotoIf($["${SOLDE}" <= "0"]?no_credit)
 same => n,Dial(PJSIP/${EXTEN},30,tT)
 same => n,Hangup()
 same => n(no_credit),Playback(auth-incorrect)
 same => n,Hangup()

exten => 500,1,Answer()
 same => n,Playback(beep)
 same => n,Echo()
 same => n,Hangup()

[default]
exten => _X.,1,Hangup()
